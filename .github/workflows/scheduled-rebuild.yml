# .github/workflows/scheduled-rebuild.yml
# Automated rebuild every 2 hours to keep farm data fresh

name: Scheduled Rebuild

on:
  # Run every 2 hours at :00 minutes (UTC)
  schedule:
    - cron: '0 */2 * * *'

  # Allow manual triggers for testing and emergency rebuilds
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rebuild'
        required: false
        default: 'Manual trigger'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Fail if exceeds 15 minutes
    permissions:
      contents: read
      deployments: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install web dependencies (including devDependencies for sharp)
      run: cd web && npm ci --include=dev

    - name: Log trigger source
      run: |
        echo "Triggered by: ${{ github.event_name }}"
        echo "Reason: ${{ inputs.reason || 'Scheduled (every 2 hours)' }}"
        echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

    - name: Run prebuild scripts
      run: cd web && npm run prebuild
      env:
        CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        CLOUDFLARE_D1_URL: ${{ secrets.CLOUDFLARE_D1_URL }}
        NODE_ENV: production

    - name: Build Next.js site
      run: cd web && npm run build
      env:
        NODE_ENV: production
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: pickafarm
        directory: web/out
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify success
      if: success()
      run: |
        echo "✅ Scheduled rebuild completed successfully"
        echo "Build time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Triggered by: ${{ github.event_name }}"

    - name: Notify failure to Zoho Cliq
      if: failure()
      run: |
        curl -X POST "${{ secrets.CLIQ_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "🚨 *Scheduled Rebuild FAILED*",
            "card": {
              "title": "Scheduled Rebuild Failed",
              "theme": "modern-inline",
              "thumbnail": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
            },
            "slides": [
              {
                "type": "table",
                "title": "Rebuild Details",
                "data": {
                  "headers": ["Property", "Value"],
                  "rows": [
                    ["Workflow", "${{ github.workflow }}"],
                    ["Repository", "${{ github.repository }}"],
                    ["Trigger", "${{ github.event_name }}"],
                    ["Time", "${{ github.event.repository.updated_at }}"]
                  ]
                }
              }
            ],
            "buttons": [
              {
                "label": "View Logs",
                "type": "+",
                "action": {
                  "type": "open.url",
                  "data": {
                    "web": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              }
            ]
          }'
