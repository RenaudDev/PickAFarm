# .github/workflows/rebuild-farms.yml
# Triggered by Zoho webhook via repository_dispatch or manual API call

name: Rebuild Farm Directory

on:
  repository_dispatch:
    types: [rebuild-farms]
  # Also allow manual triggers for testing
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rebuild'
        required: false
        default: 'Manual trigger'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Fail if exceeds 15 minutes
    permissions:
      contents: read
      deployments: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main-clean
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install web dependencies (including devDependencies for sharp)
      run: cd web && npm ci --include=dev

    - name: Log trigger source
      run: |
        echo "Triggered by: ${{ github.event_name }}"
        echo "Reason: ${{ github.event.client_payload.reason || inputs.reason || 'Webhook trigger' }}"
        echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Farm updated: ${{ github.event.client_payload.zoho_record_id || 'N/A' }}"

    - name: Build with Cloudflare Pages adapter
      run: cd web && npx @cloudflare/next-on-pages@1
      env:
        NODE_ENV: production
        # Database credentials for prebuild scripts
        CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        CLOUDFLARE_D1_URL: ${{ secrets.CLOUDFLARE_D1_URL }}
        # Clerk authentication
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        # Google Maps
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        # API URL
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: pickafarm
        directory: web/.vercel/output/static
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify success
      if: success()
      run: |
        echo "✅ Farm directory rebuild completed successfully"
        echo "Build time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Triggered by: ${{ github.event_name }}"
        echo "Farm updated: ${{ github.event.client_payload.zoho_record_id || 'N/A' }}"

    - name: Notify failure to Zoho Cliq
      if: failure()
      run: |
        curl -X POST "${{ secrets.CLIQ_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "🚨 *Farm Directory Rebuild FAILED*",
            "card": {
              "title": "Farm Directory Rebuild Failed",
              "theme": "modern-inline",
              "thumbnail": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
            },
            "slides": [
              {
                "type": "table",
                "title": "Rebuild Details",
                "data": {
                  "headers": ["Property", "Value"],
                  "rows": [
                    ["Workflow", "${{ github.workflow }}"],
                    ["Repository", "${{ github.repository }}"],
                    ["Trigger", "${{ github.event_name }}"],
                    ["Time", "${{ github.event.repository.updated_at }}"],
                    ["Farm ID", "${{ github.event.client_payload.zoho_record_id || 'N/A' }}"]
                  ]
                }
              }
            ],
            "buttons": [
              {
                "label": "View Logs",
                "type": "+",
                "action": {
                  "type": "open.url",
                  "data": {
                    "web": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              }
            ]
          }'