name: Preview Deployment Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main-clean]

# Permissions needed to post PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  post-preview-url:
    name: Post Preview URL Comment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'

    steps:
      - name: Wait for Cloudflare Pages deployment
        run: |
          echo "Waiting 30 seconds for Cloudflare Pages deployment to start..."
          sleep 30

      - name: Generate preview URL
        id: preview-url
        run: |
          # Cloudflare Pages preview URL format
          # Branch name is sanitized: lowercase, special chars replaced with hyphen
          BRANCH_NAME="${{ github.head_ref }}"
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          PREVIEW_URL="https://${SANITIZED_BRANCH}.pickafarm.pages.dev"

          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "sanitized_branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = '${{ steps.preview-url.outputs.preview_url }}';
            const sanitizedBranch = '${{ steps.preview-url.outputs.sanitized_branch }}';
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const timestamp = new Date().toISOString();

            // Check if we already posted a comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🔍 Preview Deployment')
            );

            const commentBody = `## 🔍 Preview Deployment

✅ **Preview deployment is building or ready!**

**Preview URL**: ${previewUrl}
**Branch**: \`${sanitizedBranch}\`
**Commit**: \`${commitSha}\`
**Updated**: ${timestamp}

---

### Preview Information

- 🚀 **Branch alias**: Your preview is available at \`${sanitizedBranch}.pickafarm.pages.dev\`
- 🔄 **Auto-updates**: This preview will automatically update with new commits
- ⏱️ **Build time**: Preview deployments typically take 5-10 minutes to complete
- 🌐 **Environment**: Preview deployments use production data (read-only)

### What to Check

- [ ] Homepage loads correctly
- [ ] Farm listings display production data
- [ ] Search functionality works
- [ ] Category and location pages render
- [ ] Navigation and routing work as expected

### Note

If the preview URL shows a 404 error, the deployment may still be building. Wait a few minutes and refresh. You can check the deployment status in the [Cloudflare Pages Dashboard](https://dash.cloudflare.com/).

---

💡 *This preview is built from the latest commit and will auto-update on new pushes.*`;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log('Updated existing preview comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
              console.log('Created new preview comment');
            }

      - name: Summary
        run: |
          echo "### ✅ Preview URL Posted Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL**: ${{ steps.preview-url.outputs.preview_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ steps.preview-url.outputs.sanitized_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The preview URL has been posted to PR #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
