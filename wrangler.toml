name = "pickafarm-api"
main = "src/index.js"
compatibility_date = "2024-09-17"

[vars]
ENVIRONMENT = "development"
GITHUB_OWNER = "RenaudDev"
GITHUB_REPO  = "PickAFarm"
GITHUB_EVENT = "rebuild-farms"
ZOHO_DC = "ca"
FROM_EMAIL = "PickAFarm Notifications <updates@notifications.pickafarm.com>"

[[d1_databases]]
binding = "DB"
database_name = "pickafarm-db"
database_id = "175c8757-6538-4bb7-ba4a-a7e4590e6478"

# Cloudflare Pages will detect Next.js automatically
# No manual configuration needed for Next.js deployment
